syntax = "proto3";

package common.v1;

option go_package = "github.com/Ilia9531/microservices-warehouse/shared/pkg/proto/common/v1;commonv1";

// NotificationMethod используется в Register и GetUser
message NotificationMethod {
  string provider_name = 1; // telegram, email, push
  string target = 2;        // email, chat_id и т.д.
}

// Полная модель пользователя
message User {
  string uuid = 1;
  string login = 2;
  string email = 3;
  repeated NotificationMethod notification_methods = 4;
}